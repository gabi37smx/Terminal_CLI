# tareas.toml · acciones personalizadas del CLI gabriel
# Ejemplo: cópialo a ~/pruebas-tareas/tareas.toml y ejecuta allí los comandos.

[acciones.ordenar]
descripcion = "Ordena los ficheros de Descargas por asignatura del DAM"
tipo        = "asignaturas"
origen      = "~/pruebas-tareas"

[acciones.ordenar.carpetas]
programacion  = ["programacion", "python", "poo", "clase", "funcion", "objeto"]
sistemas      = ["sistemas", "linux", "redes", "hardware", "so"]
bases-datos   = ["bases de datos", "sql", "mysql", "consulta", "tabla"]
lenguaje-marcas = ["lenguaje de marcas", "marcas", "xml", "html", "json"]
entornos      = ["entornos", "git", "ide", "compilador", "docker"]
ipo           = ["ipo", "empleabilidad", "curriculum", "entrevista"]
ingles        = ["english", "ingles", "vocabulary", "grammar"]
proyecto      = ["proyecto", "intermodular", "multiplataforma"]

[acciones.limpiar-temporales]
descripcion = "Borra ficheros temporales con más de 30 días"
tipo        = "limpiar"
origen      = "~/Descargas"
dias        = 30

[acciones.convertir-webp]
descripcion = "Convierte las imágenes JPEG y PNG a WebP"
tipo        = "convertir"
origen      = "~/Imágenes"
