# Pasa los tests en cada push y en cada PR, en Linux (como el PC de clase) y en Windows.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar Python y dependencias
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
