[project]
name = "tareas"
version = "0.1.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "gabi37smx", email = "gabrielvidal37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pypdf>=6.21.3",
    "typer>=0.27.3",
]

[project.scripts]
dam = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
