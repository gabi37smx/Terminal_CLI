[project]
name = "tareas"
version = "1.0.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "gabi37smx", email = "gabrielvidal37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
dam = "tareas.cli:app"
# El mismo programa con el nombre de la spec v0: «tareas version» → tareas 1.0.0
tareas = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
